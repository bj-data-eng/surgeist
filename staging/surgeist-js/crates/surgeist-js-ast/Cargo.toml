[package]
workspace = "../.."
description = "ECMAScript syntax trees."
publish = false
name = "surgeist-js-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
annex-b = []
serde = ["dep:serde", "surgeist-js-interner/serde", "bitflags/serde", "num-bigint/serde"]
arbitrary = ["dep:arbitrary", "surgeist-js-interner/arbitrary", "num-bigint/arbitrary"]

[dependencies]
surgeist-js-interner.workspace = true
surgeist-js-macros.workspace = true
surgeist-js-string.workspace = true
rustc-hash = { workspace = true, features = ["std"] }
bitflags.workspace = true
num-bigint.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
indexmap.workspace = true
strum.workspace = true
