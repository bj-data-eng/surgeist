[package]
workspace = "../.."
description = "Interned JavaScript names."
publish = false
name = "surgeist-js-interner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
serde = ["dep:serde"]
arbitrary = ["dep:arbitrary"]

[dependencies]
surgeist-js-macros.workspace = true
surgeist-js-gc.workspace = true
phf = { workspace = true, default-features = false, features = ["macros"] }
rustc-hash = { workspace = true, default-features = false }
static_assertions.workspace = true
once_cell = { workspace = true, features = ["std"]}
indexmap.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
hashbrown.workspace = true
