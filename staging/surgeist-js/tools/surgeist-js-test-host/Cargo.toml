[package]
workspace = "../.."
description = "Host APIs for the upstream conformance and benchmark workloads."
publish = false
name = "surgeist-js-test-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
surgeist-js.workspace = true
surgeist-js-gc.workspace = true
surgeist-js-test-web-api.workspace = true
bus = { workspace = true, optional = true }
bytemuck.workspace = true
either = { workspace = true, optional = true }
futures = "0.3.32"
futures-lite.workspace = true
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustc-hash = { workspace = true, features = ["std"] }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
indoc.workspace = true
rstest.workspace = true
test-case.workspace = true
textwrap.workspace = true
temp-env.workspace = true

[features]
# Default should not add `reqwest` as it is not available on all platforms.
default = [
    "surgeist-js/float16",
    "surgeist-js/temporal",
    "surgeist-js/xsum",
    "fetch",
    "url",
]

all = ["default", "reqwest-blocking"]
url = ["dep:url"]
fetch = [
    "dep:either",
    "dep:http",
    "dep:serde_json",
    "surgeist-js/either",
]
reqwest-blocking = ["dep:reqwest", "reqwest/blocking"]
process = []
annex-b = ["surgeist-js/annex-b"]
test262 = ["dep:bus"]
