schema = 1
fixtures = ["seeds/document", "seeds/fragment"]

[[targets]]
id = "surgeist-html::unicode-document"
owner = "surgeist-html"
binary = "html-document-worker"
properties = ["surgeist-html::source-preservation", "surgeist-html::native-report", "surgeist-html::diagnostic-provenance", "surgeist-html::terminal-ownership", "surgeist-html::immutable-after-cancel", "surgeist-html::literal-semantics"]
source_references = ["references/SOURCE-EDITIONS.md#pinned-html-language-baseline", "crates/surgeist-html/src/request.rs", "crates/surgeist-html/src/source.rs", "crates/surgeist-html/src/construction/parser_session/read.rs", "crates/surgeist-html/tests/public_parse.rs", "crates/surgeist-html/fuzz/README.md"]
format = { identity = "surgeist-html::unicode-parse", revision = 1 }
generator_identity = { identity = "surgeist-html::unicode-document", revision = 1 }
encoding = "structured"
limits = { bytes = 65536, nodes = 64, depth = 8, text_units = 8192, operations = 8 }
requirements = { features = [], capabilities = ["replay", "case-capture"] }
min_evaluated = 1
max_generation_rejections = 64

