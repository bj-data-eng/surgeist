[package]
name = "surgeist-text"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
description = "Parley-backed text layout boundary for Surgeist surfaces."

[lib]
name = "surgeist_text"
path = "src/lib.rs"

[dependencies]
accesskit = { version = "=0.24.1", optional = true }
fontique = { version = "=0.9.0", default-features = false, features = ["std", "system"] }
icu_properties = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
linebender_resource_handle = { version = "=0.1.1", default-features = false, features = ["std"] }
parley = "=0.9.0"
skrifa = { version = "=0.42.1", default-features = false, features = ["std"] }

[features]
default = []
text-accessibility = ["dep:accesskit"]
