# Maintained Surgeist package; original and pre-migration manifests are in upstream/.
# Original workspace and registry manifests are preserved in upstream/.
[package]
name = "surgeist-shaper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Safe Rust OpenType and AAT shaping with explicit completion and source custody."
repository = "https://github.com/bj-data-eng/surgeist"
license = "MIT"
readme = "README.md"
keywords = ["text", "shaping", "opentype", "truetype"]
categories = ["text-processing"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "surgeist_shaper"
path = "src/lib.rs"
bench = false

[features]
default = ["std"]
std = ["read-fonts/std"]

[dependencies]
bitflags = "2.9"
bytemuck = { version = "1.22", features = ["extern_crate_alloc"] }
core_maths = "0.1"
read-fonts = { version = "0.39.0", default-features = false, features = ["libm"] }
smallvec = "1.14"

[lints.clippy]
cargo_common_metadata = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
fn_params_excessive_bools = "allow"
if_not_else = "allow"
items_after_statements = "allow"
large-stack-arrays = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_continue = "allow"
needless_pass_by_value = "allow"
range_plus_one = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
used_underscore_binding = "allow"
used_underscore_items = "allow"
wildcard_imports = "allow"

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
