[package]
name = "surgeist-window"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
description = "Native window boundary for Surgeist."

[lib]
name = "surgeist_window"
path = "src/lib.rs"

[dependencies]
accesskit = { version = "=0.24.1", optional = true }
accesskit_winit = { version = "=0.33.0", optional = true }
cursor-icon = "=1.2.0"
keyboard-types = "=0.7.0"
raw-window-handle = "=0.6.2"
winit = "=0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSFont", "NSFontManager", "NSWorkspace", "objc2-core-foundation"] }

[[test]]
name = "system_fonts_native"
path = "tests/system_fonts_native.rs"
harness = false

[[test]]
name = "native_preferences_native"
path = "tests/native_preferences_native.rs"
harness = false

[features]
default = []
accessibility = ["dep:accesskit_winit", "dep:accesskit"]
