[package]
name = "surgeist-cssom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Owning authored CSS state, atomic edits, and immutable snapshots."
readme = "README.md"

[dependencies]
surgeist-css = { path = "../surgeist-css", version = "=0.1.0" }

[dev-dependencies]
stats_alloc = { version = "=0.1.10", default-features = false }
surgeist-ledger = { path = "../surgeist-ledger", version = "=0.1.0" }

[[bench]]
name = "store_edits"
harness = false

[[bench]]
name = "bootstrap_sheet"
harness = false
