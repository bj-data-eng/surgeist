[package]
name = "surgeist-css-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
description = "Bounded CSS ingestion, recovery and authored-value cases with exact replay."

[package.metadata]
cargo-fuzz = true

[package.metadata.surgeist-fuzz]
descriptor = "fuzz.toml"

[features]
default = []
property = ["surgeist-fuzz/property", "dep:proptest"]
coverage = ["surgeist-fuzz/coverage", "dep:libfuzzer-sys"]

[dependencies]
surgeist-css = { path = "..", version = "=0.1.0" }
surgeist-css-parser = { path = "../../surgeist-css-parser", version = "=0.1.0" }
surgeist-fuzz = { path = "../../surgeist-fuzz", version = "=0.1.0" }
toml = "=0.9.8"
proptest = { version = "=1.11.0", default-features = false, features = ["std"], optional = true }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[dev-dependencies]
serde_json = "=1.0.151"

[[bin]]
name = "css-bytes-worker"
path = "src/bin/bytes.rs"
test = false
doc = false

[[bin]]
name = "css-source-worker"
path = "src/bin/source.rs"
test = false
doc = false

[[bin]]
name = "css-value-worker"
path = "src/bin/value.rs"
test = false
doc = false

[[bin]]
name = "css-rules-worker"
path = "src/bin/rules.rs"
test = false
doc = false

[lints]
workspace = true
