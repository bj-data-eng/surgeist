[package]
name = "surgeist-css"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
description = "Strict CSS ingestion for Surgeist style sheets."

[lib]
name = "surgeist_css"
path = "src/lib.rs"

[features]
default = []

[dependencies]
cssparser = "=0.37.0"
cssparser-color = "=0.5.0"

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
