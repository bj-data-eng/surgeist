[package]
name = "surgeist-css"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
description = "Strict CSS ingestion for Surgeist style sheets."

[lib]
name = "surgeist_css"
path = "src/lib.rs"

[features]
default = []

[dependencies]
surgeist-color = { path = "../surgeist-color", version = "=0.1.0" }
cssparser = "=0.37.0"
encoding_rs = "=0.8.35"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
stats_alloc = { version = "=0.1.10", default-features = false }
surgeist-fuzz = { path = "../surgeist-fuzz", features = ["property"] }

# Integration tests share the `css` binary (tests/css.rs). The targets below
# install a global allocator to count allocations, so each keeps its own
# process.
[[test]]
name = "property_component_admission_allocations"
harness = false

[[test]]
name = "checked_admission_borrowing"
harness = false

[[test]]
name = "component_borrow_retention"
