[package]
name = "surgeist-fixture-fuzz"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[package.metadata.surgeist-fuzz]
descriptor = "fuzz.toml"

[features]
default = []
property = ["surgeist-fuzz/property", "dep:proptest"]
coverage = ["surgeist-fuzz/coverage", "dep:libfuzzer-sys"]

[dependencies]
surgeist-fixture = { path = ".." }
surgeist-fuzz = { path = "../../../.." }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
proptest = { version = "=1.11.0", default-features = false, features = ["std"], optional = true }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[[bin]]
name = "fixture-worker"
path = "src/bin/bytes.rs"
test = false
doc = false

[[bin]]
name = "fixture-structured-worker"
path = "src/bin/structured.rs"
test = false
doc = false
