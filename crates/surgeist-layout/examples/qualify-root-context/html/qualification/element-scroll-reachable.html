<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<script src="../../scripts/gentest/test_helper.js"></script>
<link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
<title>Root context element-scroll-reachable</title>
</head>
<body dir="ltr"><div id="test-root" style="display:grid;width:200px;height:120px;grid-template-columns:200px;grid-template-rows:40px 40px 40px;gap:0px;justify-items:start;align-items:start;justify-content:start;align-content:start;">
  <div style="position:relative;display:block;width:20.25px;height:30.25px;overflow:visible;grid-column:1;grid-row:1;">
    <div style="position:absolute;display:block;left:-8px;right:auto;top:0px;bottom:auto;width:33px;height:40.5px;"></div>
  </div>
  <div style="position:relative;display:block;width:20.25px;height:30.25px;overflow:clip;grid-column:1;grid-row:2;">
    <div style="position:absolute;display:block;left:-8px;right:auto;top:0px;bottom:auto;width:33px;height:40.5px;"></div>
  </div>
  <div style="position:relative;display:block;width:20.25px;height:30.25px;overflow:hidden;grid-column:1;grid-row:3;">
    <div style="position:absolute;display:block;left:-8px;right:auto;top:0px;bottom:auto;width:33px;height:40.5px;"></div>
  </div>
</div></body>
</html>
