<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Block ratio minimum and percentage basis</title>
</head>
<body>
  <div id="test-root" style="display: block; width: 100px; height: 400px;">
    <div style="display: block; aspect-ratio: 2;">
      <div style="display: block; height: 80px;"></div>
    </div>
    <div style="display: block; overflow: hidden; aspect-ratio: 2;">
      <div style="display: block; height: 80px;"></div>
    </div>
    <div style="display: block; aspect-ratio: 2;">
      <div style="display: block; height: 50%;"></div>
    </div>
    <div style="display: block; box-sizing: content-box; aspect-ratio: 2; max-height: 20px; padding: 3px 10px;"></div>
    <div style="display: block; box-sizing: border-box; aspect-ratio: 2; max-height: 20px; padding: 3px 10px;"></div>
    <div style="display: block; aspect-ratio: 2; max-width: 40px; min-height: 30px;"></div>
    <div style="display: block; aspect-ratio: 2; max-width: 80px; max-height: 20px;"></div>
    <div style="display: block; aspect-ratio: 2; min-width: 60px; max-height: 20px;"></div>
    <div style="display: block; aspect-ratio: 2; max-width: 40px;">
      <div style="display: block; height: 80px;"></div>
    </div>
  </div>
</body>
</html>
