[package]
name = "surgeist-layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
description = "Layout primitives and algorithms for Surgeist document surfaces."
exclude = ["tools/surgeist-layout-audits/**"]

[lib]
name = "surgeist_layout"
path = "src/lib.rs"

[dependencies]
surgeist-ledger = { path = "../surgeist-ledger", version = "=0.1.0" }
surgeist-text = { path = "../surgeist-text", version = "=0.1.0", default-features = false }

[dev-dependencies]
surgeist-font = { path = "../surgeist-font", version = "=0.1.0" }
surgeist-test = { path = "../surgeist-test", version = "=0.1.0" }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[[bench]]
name = "structure"
harness = false

[[bench]]
name = "text"
harness = false
