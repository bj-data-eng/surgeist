[package]
name = "surgeist-layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
description = "Layout primitives and algorithms for Surgeist document surfaces."
exclude = ["tools/surgeist-layout-audits/**"]

[lib]
name = "surgeist_layout"
path = "src/lib.rs"

[dependencies]
surgeist-text = { path = "../surgeist-text", version = "=0.1.0", default-features = false }
surgeist-generator = { path = "../surgeist-generator", version = "=0.2.0", default-features = false, features = ["browser-corpus"], optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", features = ["raw_value"], optional = true }
serde_path_to_error = { version = "=0.1.20", optional = true }

[features]
default = []
layout-golden-generate = [
    "dep:surgeist-generator",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_path_to_error",
]

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
roxmltree = "=0.21.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[[bin]]
name = "surgeist-layout-generate"
path = "tests/bin/surgeist-layout-generate.rs"
required-features = ["layout-golden-generate"]
