[package]
name = "surgeist-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
description = "App runtime orchestration contracts for Surgeist."

[lib]
name = "surgeist_runtime"
path = "src/lib.rs"

[features]
default = []
document-scripting = ["dep:base64", "dep:sha2", "dep:surgeist-bindings-js", "dep:surgeist-ledger"]

[dependencies]
base64 = { version = "=0.22.1", default-features = false, optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
surgeist-bindings-js = { path = "../surgeist-bindings-js", version = "=0.1.0", optional = true }
surgeist-css = { path = "../surgeist-css", version = "=0.1.0" }
surgeist-cssom = { path = "../surgeist-cssom", version = "=0.1.0" }
surgeist-dom = { path = "../surgeist-dom", version = "=0.1.0" }
surgeist-html = { path = "../surgeist-html", version = "=0.1.0" }
surgeist-html-parser = { path = "../surgeist-html-parser", version = "=0.1.0", default-features = false }
surgeist-html-semantics = { path = "../surgeist-html-semantics", version = "=0.1.0" }
surgeist-ledger = { path = "../surgeist-ledger", version = "=0.1.0", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android", target_os = "ios"))'.dependencies]
getrandom = { version = "=0.3.4", default-features = false }

[[test]]
name = "document_scripting"
harness = false
required-features = ["document-scripting"]
