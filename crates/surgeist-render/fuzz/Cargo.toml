[package]
name = "surgeist-render-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
description = "Bounded public headless Render cases and exact replay."

[package.metadata]
cargo-fuzz = true

[package.metadata.surgeist-fuzz]
descriptor = "fuzz.toml"

[features]
default = []
property = ["surgeist-fuzz/property", "dep:proptest"]
coverage = ["surgeist-fuzz/coverage", "dep:libfuzzer-sys"]

[dependencies]
surgeist-render = { path = "..", version = "=0.1.0", default-features = false }
surgeist-font = { path = "../../surgeist-font", version = "=0.1.0", default-features = false }
surgeist-fuzz = { path = "../../surgeist-fuzz", version = "=0.1.0" }
toml = "=0.9.8"
proptest = { version = "=1.11.0", default-features = false, features = ["std"], optional = true }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[[bin]]
name = "render-resource-worker"
path = "src/bin/resources.rs"
test = false
doc = false

[[bin]]
name = "render-scene-worker"
path = "src/bin/scenes.rs"
test = false
doc = false

[lints]
workspace = true
