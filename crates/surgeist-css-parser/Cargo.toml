[package]
name = "surgeist-css-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CSS Syntax Module Level 3 tokenization and parsing for Surgeist."
readme = "README.md"

[lib]
name = "surgeist_css_parser"
path = "src/lib.rs"

[dependencies]
encoding_rs = "=0.8.35"

[dev-dependencies]
cssparser = "=0.37.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
surgeist-fuzz = { path = "../surgeist-fuzz", features = ["property"] }
