name: PR hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  closing-keywords:
    name: One closing keyword per issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject keyword lists and summarize closed issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          body=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""')
          messages=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" --jq '.[].commit.message')
          fetched=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" --jq '.[].sha' | wc -l | tr -d ' ')
          if [ "$fetched" -lt "$EXPECTED_COMMITS" ]; then
            echo "::warning title=Commits not checked::Only $fetched of $EXPECTED_COMMITS commits could be read; the rest were not checked for closing keywords."
          fi

          # Fenced blocks and code spans are examples, not keywords.
          text=$(printf '%s\n%s\n' "$body" "$messages" \
            | awk '/^[[:space:]]*(```|~~~)/ { fenced = !fenced; next } !fenced' \
            | sed 's/`[^`]*`//g')

          keyword='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?)'
          issue='([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+'
          separator='[[:space:]]*(,|;|/|&|and|or)?[[:space:]]*(and[[:space:]]+)?'
          list="$keyword:?[[:space:]]+$issue$separator$issue"
          if lists=$(printf '%s\n' "$text" | grep -ainE "$list"); then
            while IFS= read -r line; do
              line=${line#*:}
              line=${line//'%'/%25}
              line=${line//$'\r'/}
              echo "::error title=Closing keyword list::$line -- GitHub links only the first issue of a list; give each issue its own line."
            done <<< "$lists"
            exit 1
          fi

          single="$keyword:?[[:space:]]+$issue"
          {
            echo "### Issues this pull request closes"
            echo
            echo "Merging closes these issues."
            echo
            printf '%s\n' "$text" | grep -aioE "$single" | grep -aoE "$issue" | sort -u | sed 's/^/- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"

  tool-names:
    name: No tool names in text, commits or files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reject tool names and banned words in the title, body, commit messages, paths and files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          # The bracketed letters match the words without this file containing them.
          pattern='[c]odex|[c]laude'
          # Banned words, matched anywhere in a string, as in identifiers.
          words='[h]onest|[n]obody'
          found=0
          report() {
            local text=${2//'%'/%25}
            text=${text//$'\r'/}
            echo "::error title=$1::$text"
            found=1
          }

          pr_text=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.title + "\n" + (.body // "")')
          while IFS= read -r line; do
            report "Tool name or banned word in the pull request" "$line"
          done < <(printf '%s\n' "$pr_text" | grep -aiE "$pattern|$words" || true)

          fetched=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" --jq '.[].sha' | wc -l | tr -d ' ')
          if [ "$fetched" -lt "$EXPECTED_COMMITS" ]; then
            echo "::warning title=Commits not checked::Only $fetched of $EXPECTED_COMMITS commits could be read; the rest were not checked for tool names."
          fi
          while IFS= read -r line; do
            report "Tool name or banned word in a commit message" "$line"
          done < <(gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" \
            --jq '.[] | .sha[0:9] as $sha | .commit.message | split("\n")[] | $sha + ": " + .' \
            | grep -aiE "$pattern|$words" || true)

          # The local tooling folder's skill links are allowed as paths.
          while IFS= read -r path; do
            report "Tool name in a path" "$path"
          done < <(git ls-files | grep -aiE "$pattern" | grep -avE '^\.[c]laude/skills/' || true)
          while IFS= read -r path; do
            report "Banned word in a path" "$path"
          done < <(git ls-files | grep -avE '^references/' | grep -aiE "$words" || true)

          # Files named README may name tools. So may the two .gitignore
          # lines that ignore the local tooling folder except its skill links.
          while IFS= read -r match; do
            file=${match%%:*}
            rest=${match#*:}
            number=${rest%%:*}
            echo "::error file=$file,line=$number,title=Tool name in a file::${rest#*:}"
            found=1
          done < <(git grep -I -n -i -E "$pattern" -- . ':(exclude,glob)**/README' ':(exclude,glob)**/README.*' \
            | grep -avE '^\.gitignore:[0-9]+:(/\.[c]laude/\*|!/\.[c]laude/skills/)$' || true)

          # Retained specification captures under references/ are verbatim
          # sources and may contain the banned words; so may README files.
          while IFS= read -r match; do
            file=${match%%:*}
            rest=${match#*:}
            number=${rest%%:*}
            echo "::error file=$file,line=$number,title=Banned word in a file::${rest#*:}"
            found=1
          done < <(git grep -I -n -i -E "$words" -- . ':(exclude)references' ':(exclude,glob)**/README' ':(exclude,glob)**/README.*' || true)

          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "No tool names or banned words found."

  branch-name:
    name: Branch follows branch/<topic>
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warn when the head branch is not branch/<topic>
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            branch/?*)
              echo "$HEAD_REF follows branch/<topic>."
              ;;
            *)
              echo "::warning title=Branch name::$HEAD_REF does not follow branch/<topic>. That is fine only when the assignment named the branch."
              ;;
          esac
