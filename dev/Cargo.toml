[package]
name = "surgeist-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native integration harness for exercising Surgeist window, render, and text crates."

[lib]
name = "surgeist_dev"
path = "src/lib.rs"

[[bin]]
name = "surgeist-dev"
path = "src/main.rs"

[dependencies]
keyboard-types.workspace = true
pollster.workspace = true
surgeist = { workspace = true, features = ["render-window", "text-render", "text-accessibility"] }
