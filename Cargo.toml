[package]
name = "surgeist"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-native UI authoring toolkit for retained, CSS-styled document surfaces."
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
rust-version = "1.99.1"
exclude = ["Cargo.lock"]

[lib]
name = "surgeist"
path = "src/lib.rs"

[dependencies]
surgeist-color = { path = "crates/surgeist-color", version = "=0.1.0" }
surgeist-animation = { path = "crates/surgeist-animation", version = "=0.1.0" }
surgeist-css = { path = "crates/surgeist-css", version = "=0.1.0" }
surgeist-cssom = { path = "crates/surgeist-cssom", version = "=0.1.0" }
surgeist-dialog = { path = "crates/surgeist-dialog", version = "=0.1.0" }
surgeist-dom = { path = "crates/surgeist-dom", version = "=0.1.0" }
surgeist-font = { path = "crates/surgeist-font", version = "=0.1.0" }
surgeist-html = { path = "crates/surgeist-html", version = "=0.1.0" }
surgeist-html-parser = { path = "crates/surgeist-html-parser", version = "=0.1.0" }
surgeist-html-semantics = { path = "crates/surgeist-html-semantics", version = "=0.1.0" }
surgeist-layout = { path = "crates/surgeist-layout", version = "=0.1.0" }
surgeist-render = { path = "crates/surgeist-render", version = "=0.1.0" }
surgeist-runtime = { path = "crates/surgeist-runtime", version = "=0.1.0" }
surgeist-shape = { path = "crates/surgeist-shape", version = "=0.1.0" }
surgeist-task = { path = "crates/surgeist-task", version = "=0.1.0" }
surgeist-template = { path = "crates/surgeist-template", version = "=0.1.0" }
surgeist-text = { path = "crates/surgeist-text", version = "=0.1.0" }
surgeist-window = { path = "crates/surgeist-window", version = "=0.1.0" }

[dev-dependencies]
roxmltree = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.10.9"
surgeist-generator = { path = "crates/surgeist-generator", version = "=0.2.0", default-features = false }
surgeist-test = { path = "crates/surgeist-test", version = "=0.1.0" }

[[example]]
name = "qualify-registered-text-render"
path = "tests/placed_text_render/registered_browser_capture.rs"
required-features = ["render-text"]

[features]
default = []
dialog-system = ["surgeist-dialog/system"]
render-text = ["surgeist-render/render-text"]
render-web = ["surgeist-render/render-web"]
render-window = ["surgeist-render/render-window"]
text-accessibility = ["surgeist-text/text-accessibility"]
window-accessibility = ["surgeist-window/accessibility"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
rust-version = "1.99.1"

[workspace]
resolver = "3"
default-members = ["."]
members = [
    "crates/surgeist-ledger",
    "crates/surgeist-animation",
    "crates/surgeist-color",
    "crates/surgeist-css",
    "crates/surgeist-cssom",
    "crates/surgeist-dialog",
    "crates/surgeist-dom",
    "crates/surgeist-font",
    "crates/surgeist-generator",
    "crates/surgeist-fuzz",
    "crates/surgeist-html",
    "crates/surgeist-html-parser",
    "crates/surgeist-html-semantics",
    "crates/surgeist-html/fuzz",
    "crates/surgeist-layout",
    "crates/surgeist-render",
    "crates/surgeist-runtime",
    "crates/surgeist-shape",
    "crates/surgeist-shaper",
    "crates/surgeist-task",
    "crates/surgeist-template",
    "crates/surgeist-test",
    "crates/surgeist-text",
    "crates/surgeist-typed-winsafe",
    "crates/surgeist-window",
    "tools/cssom-reflections",
    "crates/surgeist-js",
    "crates/surgeist-js-ast",
    "crates/surgeist-js-gc",
    "crates/surgeist-js-icu-provider",
    "crates/surgeist-js-interner",
    "crates/surgeist-js-macros",
    "crates/surgeist-js-parser",
    "crates/surgeist-js-string",
    "crates/surgeist-js-small-btree",
    "tools/surgeist-js-test-host",
    "tools/surgeist-js-test-web-api",
    "tools/surgeist-js-benchmarks",
    "tools/surgeist-js-test262",
    "tools/surgeist-js-macro-tests",
    "tools/surgeist-js-bytecode-tests",
]
exclude = [
    "api/generator",
    "crates/surgeist-layout/tools/surgeist-layout-audits",
]

[workspace.dependencies]
surgeist-ledger = { path = "crates/surgeist-ledger", version = "=0.1.0" }
surgeist-js = { path = "crates/surgeist-js", version = "=0.1.0", default-features = false }
surgeist-js-ast = { path = "crates/surgeist-js-ast", version = "=0.1.0" }
surgeist-js-gc = { path = "crates/surgeist-js-gc", version = "=0.1.0" }
surgeist-js-icu-provider = { path = "crates/surgeist-js-icu-provider", version = "=0.1.0" }
surgeist-js-interner = { path = "crates/surgeist-js-interner", version = "=0.1.0" }
surgeist-js-macros = { path = "crates/surgeist-js-macros", version = "=0.1.0" }
surgeist-js-parser = { path = "crates/surgeist-js-parser", version = "=0.1.0" }
surgeist-js-string = { path = "crates/surgeist-js-string", version = "=0.1.0" }
surgeist-js-small-btree = { path = "crates/surgeist-js-small-btree", version = "=0.1.0" }
surgeist-js-test-host = { path = "tools/surgeist-js-test-host", version = "=0.1.0" }
surgeist-js-test-web-api = { path = "tools/surgeist-js-test-web-api", version = "=0.1.0" }

arbitrary = "1"
base64 = "0.23.1"
bitflags = "2.13.1"
clap = "4.6.6"
colored = "3.1.1"
cow-utils = "0.1.3"
fast-float2 = "0.2.4"
hashbrown = "0.17.1"
http = { version = "1.5.0" }
iana-time-zone = "0.1.65"
indexmap = { version = "2.14.0", default-features = false }
indoc = "2.0.7"
itoa = "1.0.18"
lz4_flex = "0.14.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
once_cell = { version = "1.21.4", default-features = false }
oneshot = "0.2.1"
phf = { version = "0.14.0", default-features = false }
regress = { version = "0.12.0", features = ["utf16"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustc-hash = { version = "2.1.3", default-features = false }
serde_json = "1.0.151"
serde = "1.0.229"
static_assertions = "1.1.0"
textwrap = "0.16.2"
thin-vec = "0.2.19"
time = { version = "0.3.55", default-features = false, features = [
    "local-offset",
    "large-dates",
    "parsing",
    "formatting",
    "macros",
] }
trybuild = "1.0.120"
rayon = "1.12.0"
toml = "1.1.4"
color-eyre = "0.6.5"
comfy-table = { version = "8.0.0", default-features = false }
serde_repr = "0.1.21"
bus = "2.4.1"
getrandom = { version = "0.4.3", default-features = false }
quote = "1.0.47"
syn = { version = "3.0.4", default-features = false }
proc-macro2 = "1.0"
synstructure = "0.14"
pastey = "0.2.3"
rand = "0.10.2"
num-integer = "0.1.47"
ryu-js = "1.0.3"
tap = "1.0.1"
thiserror = { version = "2.0.20", default-features = false }
dashmap = "6.2.1"
itertools = { version = "0.15.0", default-features = false }
portable-atomic = "1.15.0"
bytemuck = { version = "1.25.2", default-features = false }
arrayvec = "0.7.8"
cfg-if = "1.0.4"
either = "1.18.0"
sys-locale = "0.3.2"
timezone_provider = { version = "0.2.6" }
temporal_rs = { version = "0.2.6", default-features = false, features = ["float64_representable_durations"] }
web-time = "1.1.0"
criterion = "0.8.2"
float-cmp = "0.10.0"
futures-lite = "2.6.1"
test-case = "3.3.1"
rstest = "0.26.1"
url = "2.5.8"
futures-concurrency = "7.7.1"
dynify = "0.1.2"
temp-env = "0.3.6"
strum = { version = "0.28", features = ["derive"] }
async-channel = "2.5.0"
icu_provider = { version = "2.3.1", default-features = false }
icu_locale_core = { version = "2.3.0", default-features = false }
icu_locale = { version = "~2.3.0", default-features = false }
icu_datetime = { version = "~2.3.0", default-features = false }
icu_time = { version = "~2.3.0", default-features = false }
icu_calendar = { version = "~2.3.0", default-features = false }
icu_collator = { version = "~2.3.1", default-features = false }
icu_plurals = { version = "~2.3.0", default-features = false }
icu_list = { version = "~2.3.0", default-features = false }
icu_casemap = { version = "~2.3.0", default-features = false }
icu_segmenter = { version = "~2.3.0", default-features = false }
icu_provider_adapters = { version = "~2.3.0", default-features = false }
icu_provider_blob = { version = "~2.3.0", default-features = false }
icu_properties = { version = "~2.3.0", default-features = true }
icu_normalizer = { version = "~2.3.0", default-features = false }
icu_decimal = { version = "~2.3.0", default-features = false }
icu_locale_fallback = { version = "~2.3.0", default-features = false }
writeable = "0.6.4"
tinystr = "0.8.4"
yoke = "0.8.3"
zerofrom = "0.1.8"
fixed_decimal = "0.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
accesskit_consumer = { path = "vendor/accesskit-consumer" }
