[package]
name = "surgeist"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-native UI authoring toolkit for retained, CSS-styled document surfaces."
repository = "https://github.com/bj-data-eng/surgeist"
readme = "README.md"
rust-version = "1.99.1"
exclude = ["Cargo.lock"]

[lib]
name = "surgeist"
path = "src/lib.rs"

[dependencies]
surgeist-color = { path = "crates/surgeist-color", version = "=0.1.0" }
surgeist-animation = { path = "crates/surgeist-animation", version = "=0.1.0" }
surgeist-css = { path = "crates/surgeist-css", version = "=0.1.0" }
surgeist-cssom = { path = "crates/surgeist-cssom", version = "=0.1.0" }
surgeist-dialog = { path = "crates/surgeist-dialog", version = "=0.1.0" }
surgeist-dom = { path = "crates/surgeist-dom", version = "=0.1.0" }
surgeist-font = { path = "crates/surgeist-font", version = "=0.1.0" }
surgeist-html = { path = "crates/surgeist-html", version = "=0.1.0" }
surgeist-html-parser = { path = "crates/surgeist-html-parser", version = "=0.1.0" }
surgeist-html-semantics = { path = "crates/surgeist-html-semantics", version = "=0.1.0" }
surgeist-layout = { path = "crates/surgeist-layout", version = "=0.1.0" }
surgeist-paint = { path = "crates/surgeist-paint", version = "=0.1.0" }
surgeist-render = { path = "crates/surgeist-render", version = "=0.1.0" }
surgeist-runtime = { path = "crates/surgeist-runtime", version = "=0.1.0" }
surgeist-shape = { path = "crates/surgeist-shape", version = "=0.1.0" }
surgeist-task = { path = "crates/surgeist-task", version = "=0.1.0" }
surgeist-template = { path = "crates/surgeist-template", version = "=0.1.0" }
surgeist-text = { path = "crates/surgeist-text", version = "=0.1.0" }
surgeist-window = { path = "crates/surgeist-window", version = "=0.1.0" }

[dev-dependencies]
roxmltree = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.10.9"
surgeist-generator = { path = "crates/surgeist-generator", version = "=0.2.0", default-features = false }
surgeist-test = { path = "crates/surgeist-test", version = "=0.1.0" }

[[example]]
name = "qualify-registered-text-render"
path = "tests/placed_text_render/registered_browser_capture.rs"
required-features = ["render-text"]

[features]
default = []
dialog-system = ["surgeist-dialog/system"]
render-text = ["surgeist-render/render-text"]
render-paint = ["surgeist-render/render-paint"]
render-web = ["surgeist-render/render-web"]
render-window = ["surgeist-render/render-window"]
text-accessibility = ["surgeist-text/text-accessibility"]
window-accessibility = ["surgeist-window/accessibility"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist"
rust-version = "1.99.1"

[workspace]
resolver = "3"
default-members = ["."]
members = [
    "crates/surgeist-bindings-js",
    "crates/surgeist-ledger",
    "crates/surgeist-animation",
    "crates/surgeist-color",
    "crates/surgeist-css",
    "crates/surgeist-cssom",
    "crates/surgeist-dialog",
    "crates/surgeist-dom",
    "crates/surgeist-font",
    "crates/surgeist-generator",
    "crates/surgeist-fuzz",
    "crates/surgeist-html",
    "crates/surgeist-html-parser",
    "crates/surgeist-html-semantics",
    "crates/surgeist-html/fuzz",
    "crates/surgeist-layout",
    "crates/surgeist-paint",
    "crates/surgeist-render",
    "crates/surgeist-render/fuzz",
    "crates/surgeist-runtime",
    "crates/surgeist-shape",
    "crates/surgeist-shaper",
    "crates/surgeist-task",
    "crates/surgeist-template",
    "crates/surgeist-test",
    "crates/surgeist-text",
    "crates/surgeist-typed-winsafe",
    "crates/surgeist-window",
    "tools/cssom-reflections",
]
exclude = [
    "api/generator",
    "crates/surgeist-layout/tools/surgeist-layout-audits",
]

[workspace.dependencies]
surgeist-ledger = { path = "crates/surgeist-ledger", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
accesskit_consumer = { path = "vendor/accesskit-consumer" }
