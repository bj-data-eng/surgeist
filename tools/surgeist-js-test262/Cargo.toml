[package]
workspace = "../.."
description = "ECMAScript Test262 runner."
publish = false
name = "surgeist-js-test262"
version.workspace = true
edition.workspace = true
license = "MIT OR Unlicense"
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
surgeist-js = { workspace = true, features = ["float16"] }
surgeist-js-gc.workspace = true
surgeist-js-test-host = { workspace = true, features = ["test262"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9.34" # TODO: Track https://github.com/saphyr-rs/saphyr.
serde_json.workspace = true
bitflags.workspace = true
colored.workspace = true
rustc-hash = { workspace = true, features = ["std"] }
rayon.workspace = true
toml.workspace = true
color-eyre.workspace = true
phf = { workspace = true, features = ["macros"] }
comfy-table.workspace = true
serde_repr.workspace = true
cow-utils.workspace = true

[features]
annex-b = ["surgeist-js/annex-b", "surgeist-js-test-host/annex-b"]
default = ["surgeist-js/intl_bundled", "surgeist-js/experimental", "annex-b"]
